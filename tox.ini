[tox]
envlist = py38,py39,py310,py311,py312,lint,docs,security
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    pytest-mock>=3.10.0
commands = 
    pytest tests/ -v --cov=svd_imputer --cov-report=term-missing --cov-report=xml

[testenv:lint]
deps = 
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.0.0
    pydocstyle>=6.3.0
commands = 
    black --check svd_imputer/ tests/
    isort --check-only svd_imputer/ tests/
    flake8 svd_imputer/ tests/
    mypy svd_imputer/ --ignore-missing-imports
    pydocstyle svd_imputer/ --convention=numpy

[testenv:security]
deps = 
    bandit[toml]>=1.7.5
    safety>=2.3.0
    pip-audit>=2.6.0
commands = 
    bandit -r svd_imputer/
    safety check
    pip-audit

[testenv:docs]
deps = 
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
    nbsphinx>=0.9.0
    sphinx-autodoc-typehints>=1.24.0
    sphinx-copybutton>=0.5.0
commands = 
    sphinx-build -b html docs docs/_build/html
    sphinx-build -b linkcheck docs docs/_build/linkcheck

[testenv:performance]
deps = 
    pytest-benchmark>=4.0.0
    memory-profiler>=0.60.0
commands = 
    pytest benchmarks/ --benchmark-only

[testenv:integration]
deps = 
    pytest>=7.0.0
    pytest-xdist>=3.0.0
commands = 
    pytest tests/ -m integration -v

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:report]
deps = coverage
skip_install = true
commands = 
    coverage report
    coverage html

[gh-actions]
python =
    3.8: py38, lint, docs, security
    3.9: py39, lint, docs, security
    3.10: py310, lint, docs, security
    3.11: py311, lint, docs, security
    3.12: py312, lint, docs, security